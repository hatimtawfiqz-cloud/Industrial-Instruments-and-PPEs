<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Industrial PPE Game</title>
</head>
<body>

    <!-- PASSCODE SCREEN (FIRST SCREEN) -->
    <div id="passcode-screen">
        <h1>Enter Passcode</h1>
        <input type="password" id="passcode-input" placeholder="Enter passcode">
        <br><br>
        <button onclick="checkPasscode()">Submit</button>
    </div>

    <!-- WELCOME SCREEN (SECOND SCREEN) -->
    <div id="welcome-screen" style="display:none;">
        <h1>Industrial Instruments and PPEs</h1>
        <input type="text" id="userName" placeholder="Enter Name"><br><br>
        <input type="text" id="userId" placeholder="Enter ID"><br><br>
        <button onclick="startApp()">Start Game</button>
    </div>


    <div id="game-screen" style="display:none;">
        <h2 id="timer">30</h2>
        <img id="tool-image" src="" alt="Tool" style="width:600px; display:block; margin:auto;">
        <div id="options-container"></div>
    </div>



<div id="feedback-modal" style="display:none; position:fixed; top:20%; left:25%; width:50%; background:white; color:black; padding:30px; border-radius:15px; border:3px solid #8B4513; text-align:center; z-index:1000;">
    <h2 id="modal-title"></h2>
    <p id="modal-text" style="font-size: 24px; line-height: 1.5;"></p>
    <button onclick="closeModal()" style="font-size: 20px; padding: 10px 20px;">Next</button>
</div>

    <script src="script.js"></script>
    

</body>
</html>
